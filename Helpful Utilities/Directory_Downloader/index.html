<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Directory Downloader</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>GitHub Directory Downloader</h1>
    <p>Paste a GitHub directory URL to fetch and download its contents as a zip file.</p>

    <input type="text" id="github-link" placeholder="e.g. https://github.com/owner/repo/tree/main/folder">
    <input type="text" id="github-token" placeholder="Optional: GitHub token for private access">

    <button id="fetch-info" class="btn-primary">Fetch Info</button>

    <div id="info-area"></div>

    <div id="confirm-area" class="confirm-panel">
      <button id="download-zip" class="btn-success">Download as Zip</button>
      <button id="cancel-download" class="btn-cancel">✖ Cancel</button>
    </div>

    <div id="status-area"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
