<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Directory Downloader</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"> 
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>GitHub Downloader</h1>
    <p class="subtitle">Download any GitHub directory as a zip file</p>
    
    <div class="input-group">
      <label class="input-label">Repository URL</label>
      <input type="text" id="github-link" placeholder="https://github.com/owner/repo/tree/main/path">
    </div>
    
    <div class="input-group">
      <label class="input-label">Access Token (Optional)</label>
      <input type="text" id="github-token" placeholder="Personal access token for private repositories">
    </div>
    
    <button class="btn-primary" id="fetch-info">Fetch Directory Info</button>
    
    <div id="info-area"></div>
    
    <div id="confirm-area">
      <button class="btn-secondary" id="cancel-download">Cancel</button>
      <button class="btn-download" id="download-zip">Download Zip</button>
    </div>
    
    <div id="status-area"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
