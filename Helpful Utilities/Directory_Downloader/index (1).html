<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Directory Downloader</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>GitHub Directory Downloader</h1>
    <p>Enter a GitHub directory link to get info and download all files (including subdirectories) as a zip.</p>
    <input type="text" id="github-link" placeholder="GitHub directory link (e.g. https://github.com/owner/repo/tree/main/path)" size="60">
    <input type="text" id="github-token" placeholder="Optional: GitHub token for private repos" size="60">
    <button id="fetch-info">Fetch Info</button>
    <div id="info-area"></div>
    <div id="confirm-area" style="display:none;">
      <button id="download-zip">Download as Zip</button>
      <button id="cancel-download">Cancel</button>
    </div>
    <div id="status-area"></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
