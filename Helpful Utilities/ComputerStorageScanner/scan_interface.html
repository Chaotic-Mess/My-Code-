<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Scanner — Analyze Your Drives</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .shadow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: float 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.3), transparent);
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(15, 23, 42, 0.6), transparent);
            bottom: -10%;
            right: -5%;
            animation-delay: 2s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.3), transparent);
            top: 50%;
            right: 10%;
            animation-delay: 4s;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 40px 60px;
            min-height: 100vh;
        }

        h1 {
            font-size: 4em;
            font-weight: 900;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #34d399 50%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 10px;
            animation: fadeIn 1s ease-out;
        }

        .subtitle {
            text-align: center;
            font-size: 1.1em;
            color: #9ca3af;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 40px;
            animation: fadeIn 1s ease-out 0.2s backwards;
        }

        #status-bar {
            background: rgba(16, 185, 129, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 12px 20px;
            text-align: center;
            font-weight: 500;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.1);
            animation: fadeIn 1s ease-out 0.4s backwards;
        }

        #depth-control {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.6s backwards;
        }

        #depth-control label {
            font-weight: 600;
            color: #e5e7eb;
        }

        #depth-control input {
            width: 70px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            color: #ffffff;
            font-size: 1em;
            transition: all 0.2s;
        }

        #depth-control input:focus {
            outline: none;
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        #depth-control button {
            padding: 8px 20px;
            background: linear-gradient(90deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        #depth-control button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        #depth-control span {
            color: #6b7280;
            font-size: 0.9em;
        }

        #folder-tree {
            list-style-type: none;
            padding-left: 0;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out 0.8s backwards;
        }

        .folder-item {
            padding: 8px 0;
            transition: all 0.2s;
        }

        .folder-item>.folder-item {
            padding-left: 30px;
        }

        .folder-item:hover>div {
            background: rgba(16, 185, 129, 0.05);
        }

        .toggler {
            cursor: pointer;
            user-select: none;
            margin-right: 8px;
            color: #10b981;
            transition: all 0.2s;
        }

        .toggler::before {
            content: '▶';
            display: inline-block;
            transition: transform 0.2s;
        }

        .toggler.open::before {
            transform: rotate(90deg);
        }

        .folder-item input[type="checkbox"] {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #10b981;
        }

        .folder-item>span:not(.toggler) {
            color: #e5e7eb;
        }

        .selectAllBtn {
            margin-left: 10px;
            font-size: 0.75em;
            padding: 4px 10px;
            cursor: pointer;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            transition: all 0.2s;
        }

        .selectAllBtn:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.5);
        }

        #scan-btn {
            display: block;
            width: 100%;
            padding: 18px;
            font-size: 1.3em;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
            animation: fadeIn 1s ease-out 1s backwards;
        }

        #scan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(16, 185, 129, 0.4);
        }

        #scan-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            font-size: 1.1em;
            color: #34d399;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(16, 185, 129, 0.2);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }

        .loading-text {
            font-size: 1.5em;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .loading-subtext {
            font-size: 1em;
            color: #9ca3af;
        }

        .terminal {
            margin-top: 30px;
            width: 600px;
            max-width: 90vw;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .terminal::-webkit-scrollbar {
            width: 8px;
        }

        .terminal::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        .terminal::-webkit-scrollbar-thumb {
            background: rgba(16, 185, 129, 0.5);
            border-radius: 4px;
        }

        .terminal-line {
            color: #34d399;
            margin-bottom: 4px;
            animation: fadeIn 0.3s ease-out;
        }

        .terminal-line.error {
            color: #ef4444;
        }

        .terminal-line.warning {
            color: #f59e0b;
        }

        .terminal-line.info {
            color: #06b6d4;
        }

        .terminal-prompt::before {
            content: '> ';
            color: #10b981;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }

            .container {
                padding: 30px 20px;
            }

            #depth-control {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>
    <div class="bg-layer">
        <div class="shadow-orb orb-1"></div>
        <div class="shadow-orb orb-2"></div>
        <div class="shadow-orb orb-3"></div>
    </div>
    <div class="grid-overlay"></div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text">Scanning Storage...</div>
            <div class="loading-subtext" id="loadingSubtext">This may take several minutes</div>
            <div class="terminal" id="terminal"></div>
        </div>
    </div>

    <div class="container">
        <h1>STORAGE SCANNER</h1>
        <div class="subtitle">Analyze Your System</div>
        <div id="status-bar">Loading drives...</div>
        <div id="depth-control">
            <label for="max-depth">Maximum Folder Depth:</label>
            <input type="number" id="max-depth" value="1" min="1" max="15">
            <button id="reload-btn">Reload with New Depth</button>
            <span style="margin-left: 15px; color: #7f8c8d; font-size: 0.9em;">Higher depth = longer load time</span>
        </div>
        <ul id="folder-tree"></ul>
        <button id="scan-btn" disabled>Scan Selected Folders</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const folderTree = document.getElementById('folder-tree');
            const scanBtn = document.getElementById('scan-btn');
            const statusDiv = document.getElementById('status');
            const statusBar = document.getElementById('status-bar');
            const maxDepthInput = document.getElementById('max-depth');
            const reloadBtn = document.getElementById('reload-btn');
            let loadingCount = 0;
            let maxDepth = 3;
            let abortController = null;

            function updateStatusBar(message) {
                statusBar.textContent = message;
            }

            function incrementLoading() {
                loadingCount++;
                updateStatusBar(`Loading folders... (${loadingCount} pending)`);
            }

            function decrementLoading() {
                loadingCount--;
                if (loadingCount === 0) {
                    updateStatusBar('Ready to scan. Select folders and click "Scan Selected Folders".');
                } else {
                    updateStatusBar(`Loading folders... (${loadingCount} pending)`);
                }
            }

            function loadDrives() {
                // Cancel any ongoing requests
                if (abortController) {
                    abortController.abort();
                }
                abortController = new AbortController();

                folderTree.innerHTML = '';
                loadingCount = 0;
                maxDepth = parseInt(maxDepthInput.value) || 3;
                updateStatusBar('Loading drives...');

                fetch('/get_drives', { signal: abortController.signal })
                    .then(response => response.json())
                    .then(drives => {
                        drives.forEach(drive => {
                            const li = createFolderItem(drive, drive, 0);
                            folderTree.appendChild(li);
                        });
                        if (loadingCount === 0) {
                            updateStatusBar('Ready to scan. Select folders and click "Scan Selected Folders".');
                        }
                        updateScanButtonState();
                    })
                    .catch(error => {
                        if (error.name === 'AbortError') {
                            console.log('Load cancelled by user');
                        } else {
                            console.error('Error loading drives:', error);
                        }
                    });
            }

            reloadBtn.addEventListener('click', loadDrives);

            // Initial load
            loadDrives();

            function createFolderItem(path, name, depth) {
                const li = document.createElement('li');
                li.classList.add('folder-item');
                li.dataset.path = path;

                const toggler = document.createElement('span');
                toggler.classList.add('toggler');

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.dataset.path = path;
                checkbox.addEventListener('change', handleCheckboxChange);

                const label = document.createElement('span');
                label.textContent = ` ${name}`;

                const selectAllBtn = document.createElement('button');
                selectAllBtn.textContent = 'Select/Deselect All';
                selectAllBtn.classList.add('selectAllBtn');

                li.appendChild(toggler);
                li.appendChild(checkbox);
                li.appendChild(label);
                li.appendChild(selectAllBtn);

                const sublist = document.createElement('ul');
                li.appendChild(sublist);

                // Start closed
                sublist.style.display = 'none';
                toggler.classList.remove('open');

                // Fetch subdirectories if within depth limit
                if (depth < maxDepth) {
                    incrementLoading();
                    fetchSubdirs(path, sublist, depth + 1, () => {
                        decrementLoading();
                    });
                } else {
                    // Hide toggler if we've reached max depth
                    toggler.style.visibility = 'hidden';
                    selectAllBtn.style.display = 'none';
                }

                toggler.addEventListener('click', () => {
                    const isOpen = sublist.style.display === 'block';
                    sublist.style.display = isOpen ? 'none' : 'block';
                    toggler.classList.toggle('open', !isOpen);
                });

                selectAllBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const childCheckboxes = sublist.querySelectorAll('input[type="checkbox"]');
                    const shouldSelect = Array.from(childCheckboxes).some(cb => !cb.checked);
                    childCheckboxes.forEach(cb => {
                        if (cb.checked !== shouldSelect) {
                            cb.checked = shouldSelect;
                            cb.dispatchEvent(new Event('change'));
                        }
                    });
                    updateScanButtonState();
                });

                return li;
            }

            function fetchSubdirs(path, sublist, depth, callback) {
                fetch(`/get_subdirs?path=${encodeURIComponent(path)}`, { signal: abortController.signal })
                    .then(response => response.json())
                    .then(subdirs => {
                        if (subdirs.length === 0) {
                            const emptyMsg = document.createElement('li');
                            emptyMsg.textContent = 'No sub-directories found or access denied.';
                            emptyMsg.style.paddingLeft = '20px';
                            emptyMsg.style.fontStyle = 'italic';
                            sublist.appendChild(emptyMsg);
                            const toggler = sublist.parentElement.querySelector('.toggler');
                            if (toggler) toggler.style.visibility = 'hidden';
                            const selectAllBtn = sublist.parentElement.querySelector('.selectAllBtn');
                            if (selectAllBtn) selectAllBtn.style.display = 'none';
                        } else {
                            subdirs.forEach(subdirPath => {
                                const name = subdirPath.split(/[\\/]/).pop();
                                const li = createFolderItem(subdirPath, name, depth);
                                sublist.appendChild(li);
                            });
                        }
                        if (callback) callback();
                    })
                    .catch(error => {
                        if (error.name !== 'AbortError') {
                            console.error('Error fetching subdirs:', error);
                        }
                        if (callback) callback();
                    });
            }

            function handleCheckboxChange(event) {
                const checkbox = event.target;
                const sublist = checkbox.closest('.folder-item').querySelector('ul');
                if (sublist) {
                    const childCheckboxes = sublist.querySelectorAll('input[type="checkbox"]');
                    childCheckboxes.forEach(cb => {
                        if (cb.checked !== checkbox.checked) {
                            cb.checked = checkbox.checked;
                            cb.dispatchEvent(new Event('change'));
                        }
                    });
                }
                updateScanButtonState();
            }

            function updateScanButtonState() {
                const anyChecked = folderTree.querySelector('input[type="checkbox"]:checked');
                scanBtn.disabled = !anyChecked;
            }

            function optimizeScanPaths(paths) {
                // Normalize all paths
                const normalized = paths.map(p => ({
                    original: p,
                    normalized: p.toLowerCase().replace(/[\\/]+$/, '').replace(/\\/g, '/')
                }));

                // Build a tree structure to find parent-child relationships
                const pathSet = new Set(normalized.map(p => p.normalized));
                const optimized = [];

                for (const pathObj of normalized) {
                    const path = pathObj.normalized;

                    // Check if any parent of this path is already in the list
                    let hasParent = false;
                    const parts = path.split('/');
                    for (let i = parts.length - 1; i > 0; i--) {
                        const parentPath = parts.slice(0, i).join('/');
                        if (pathSet.has(parentPath)) {
                            hasParent = true;
                            break;
                        }
                    }

                    if (!hasParent) {
                        // Check if all children are selected
                        const checkbox = folderTree.querySelector(`input[data-path="${pathObj.original}"]`);
                        if (checkbox) {
                            const parentLi = checkbox.closest('.folder-item');
                            const childCheckboxes = parentLi.querySelectorAll('ul > .folder-item > input[type="checkbox"]');
                            const childPaths = Array.from(childCheckboxes).map(cb => cb.dataset.path.toLowerCase().replace(/[\\/]+$/, '').replace(/\\/g, '/'));

                            // If we have children and all are selected, just add parent
                            if (childCheckboxes.length > 0) {
                                const allChildrenSelected = childPaths.every(cp => pathSet.has(cp));
                                if (allChildrenSelected) {
                                    optimized.push(pathObj.original);
                                    // Remove children from consideration
                                    childPaths.forEach(cp => pathSet.delete(cp));
                                } else {
                                    optimized.push(pathObj.original);
                                }
                            } else {
                                optimized.push(pathObj.original);
                            }
                        } else {
                            optimized.push(pathObj.original);
                        }
                    }
                }

                return optimized;
            }

            scanBtn.addEventListener('click', () => {
                const checkedBoxes = folderTree.querySelectorAll('input[type="checkbox"]:checked');
                const pathsToScan = Array.from(checkedBoxes).map(cb => cb.dataset.path);

                if (pathsToScan.length > 0) {
                    // Optimize the paths to avoid duplicate scanning
                    const optimizedPaths = optimizeScanPaths(pathsToScan);

                    console.log('Original paths:', pathsToScan.length);
                    console.log('Optimized paths:', optimizedPaths.length);
                    console.log('Optimized list:', optimizedPaths);

                    // Show loading overlay
                    const loadingOverlay = document.getElementById('loadingOverlay');
                    const loadingSubtext = document.getElementById('loadingSubtext');
                    const terminal = document.getElementById('terminal');
                    loadingOverlay.classList.add('active');
                    loadingSubtext.textContent = `Analyzing ${optimizedPaths.length} folder${optimizedPaths.length !== 1 ? 's' : ''}... This may take several minutes`;

                    // Clear terminal
                    terminal.innerHTML = '';

                    function addTerminalLine(text, type = 'normal') {
                        const line = document.createElement('div');
                        line.className = `terminal-line terminal-prompt ${type}`;
                        line.textContent = text;
                        terminal.appendChild(line);
                        terminal.scrollTop = terminal.scrollHeight;
                    }

                    addTerminalLine(`Starting scan of ${optimizedPaths.length} folder${optimizedPaths.length !== 1 ? 's' : ''}...`, 'info');
                    optimizedPaths.forEach((path, i) => {
                        addTerminalLine(`[${i + 1}/${optimizedPaths.length}] ${path}`);
                    });
                    addTerminalLine('Calculating folder sizes...', 'info');

                    scanBtn.disabled = true;
                    statusDiv.textContent = `Scanning ${optimizedPaths.length} folders... This may take a long time. Please wait.`;
                    statusDiv.style.display = 'block';

                    // Poll for progress updates
                    let lastProgress = '';
                    const progressInterval = setInterval(() => {
                        fetch('/progress?' + Date.now())
                            .then(res => res.json())
                            .then(progress => {
                                if (progress.current && progress.total) {
                                    const progressText = `Processing: ${progress.current}/${progress.total} - ${progress.folder}`;
                                    // Only add if it's different from the last one
                                    if (progressText !== lastProgress) {
                                        addTerminalLine(progressText);
                                        lastProgress = progressText;
                                    }
                                    
                                    // Check if scan is complete
                                    if (progress.folder === 'Complete' && progress.current === progress.total) {
                                        clearInterval(progressInterval);
                                        addTerminalLine('Scan complete! Generating report...', 'info');
                                        addTerminalLine('Report saved: storage_report.html', 'info');
                                        addTerminalLine('Opening report in browser...', 'info');
                                        statusDiv.textContent = "Scan complete! Report has been generated and opened in a new tab.";
                                    }
                                }
                            })
                            .catch(() => { });
                    }, 200);

                    fetch('/scan', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(optimizedPaths),
                    })
                        .then(response => response.json())
                        .then(data => {
                            if (data.status === 'started') {
                                // Scan started successfully, progress polling will handle completion
                                console.log('Scan started in background');
                            } else {
                                clearInterval(progressInterval);
                                addTerminalLine('ERROR: Scan failed to start', 'error');
                                statusDiv.textContent = 'An error occurred during the scan.';
                                scanBtn.disabled = false;
                            }
                        })
                        .catch(error => {
                            clearInterval(progressInterval);
                            console.error('Error:', error);
                            addTerminalLine(`ERROR: ${error.message}`, 'error');
                            statusDiv.textContent = 'Failed to start scan. See console for details.';
                            scanBtn.disabled = false;
                        });
                }
            });
        });
    </script>
</body>

</html>
