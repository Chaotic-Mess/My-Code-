<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Scraper & Downloader</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>YouTube Scraper & Downloader</h1>
    <p>Get metadata and downloadable links from any YouTube video.</p>

    <input id="yt-link" type="text" placeholder="Paste YouTube link here…">
    <button id="fetch-info" class="btn-primary">Fetch Video Info</button>

    <div id="info-area"></div>
    <div id="streams-area" class="hidden"></div>
    <div id="console-area" class="console"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
