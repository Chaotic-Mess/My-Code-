<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARES AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-gradient"></div>
  
  <div class="container">
    <div class="header">
      <div class="logo-container">
        <div class="logo">A</div>
        <div>
          <h1>ARES AI</h1>
          <div class="subtitle">Advanced Response & Engagement System</div>
        </div>
      </div>
    </div>

    <div class="chat-container">
      <div class="messages" id="messages">
        <div class="welcome-message">
          <div class="welcome-icon">💬</div>
          <div>Start a conversation with ARES AI</div>
        </div>
      </div>
      <div class="typing-indicator" id="typing">
        <div class="typing-avatar">A</div>
        <div class="typing-dots">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-container">
        <input id="input" placeholder="Type your message..." autocomplete="off" />
        <button id="sendBtn">
          <span>Send</span>
          <span>→</span>
        </button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
