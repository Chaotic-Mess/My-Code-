<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARES AI (GitHub Only)</title>
  <link rel="stylesheet" href="Style.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="container">
    <div class="header">
      <div class="logo-container">
        <div class="logo">A</div>
        <div>
          <h1>ARES AI</h1>
          <div class="subtitle">Advanced Response & Engagement System (Static Demo)</div>
        </div>
      </div>
    </div>

    <div class="chat-container">
      <div class="messages" id="messages">
        <div class="welcome-message">
          <div class="welcome-icon">💬</div>
          <div>ARES AI (Offline Mode) — running fully in your browser. Type "how work" for details.</div>
        </div>
      </div>
      <div class="typing-indicator" id="typing">
        <div class="typing-avatar">A</div>
        <div class="typing-dots">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-container">
        <input id="input" placeholder="Type your message..." autocomplete="off" />
        <button id="sendBtn">
          <span>Send</span>
          <span>→</span>
        </button>
      </div>
    </div>
  </div>

  <script src="GITHUBONLY_app.js"></script>
</body>
</html>
